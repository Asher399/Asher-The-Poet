<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Asher The Poet | Official Website</title>

  <meta name="description" content="Official website of Asher The Poet — Jacob Stephen Mphampha. Poet, author, storyteller and servant of God.">
  <meta name="author" content="Jacob Stephen Mphampha">

  <meta property="og:title" content="Asher The Poet | Official Website">
  <meta property="og:description" content="Official website of Asher The Poet — Jacob Stephen Mphampha.">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --black:#070707;
      --dark:#0d0d0d;
      --dark2:#121212;
      --gold:#d6ad55;
      --gold-light:#f0d58b;
      --cream:#f5f0e6;
      --muted:#aaa59a;
      --line:rgba(214,173,85,.18);
      --white:#ffffff;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:var(--black);
      color:var(--cream);
      font-family:"DM Sans",sans-serif;
      overflow-x:hidden;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      max-width:100%;
      display:block;
    }

    button{
      font:inherit;
    }

    ::selection{
      background:var(--gold);
      color:#000;
    }

    /* =========================
       LOADING SCREEN
    ========================== */

    #loader{
      position:fixed;
      inset:0;
      background:#050505;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
      transition:.8s ease;
    }

    .loader-inner{
      text-align:center;
    }

    .loader-name{
      font-family:"Cormorant Garamond",serif;
      font-size:2.7rem;
      color:var(--gold-light);
      letter-spacing:5px;
      text-transform:uppercase;
    }

    .loader-line{
      width:90px;
      height:1px;
      background:var(--gold);
      margin:18px auto;
      animation:pulse 1.5s infinite;
    }

    .loader-small{
      font-size:.7rem;
      letter-spacing:4px;
      color:#777;
      text-transform:uppercase;
    }

    @keyframes pulse{
      0%,100%{opacity:.25;transform:scaleX(.5)}
      50%{opacity:1;transform:scaleX(1)}
    }

    /* =========================
       NAVBAR
    ========================== */

    nav{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:1000;
      padding:22px 6%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      background:rgba(7,7,7,.78);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(255,255,255,.05);
    }

    .logo{
      font-family:"Cormorant Garamond",serif;
      font-size:1.65rem;
      font-weight:700;
      letter-spacing:2px;
      color:var(--gold-light);
    }

    .logo span{
      display:block;
      font-family:"DM Sans",sans-serif;
      font-size:.53rem;
      letter-spacing:3px;
      color:#aaa;
      margin-top:-3px;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:32px;
    }

    .nav-links a{
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:1.8px;
      color:#bbb;
      transition:.3s;
    }

    .nav-links a:hover{
      color:var(--gold-light);
    }

    .nav-contact{
      padding:11px 18px;
      border:1px solid var(--line);
      color:var(--gold-light)!important;
    }

    .menu{
      display:none;
      border:0;
      background:none;
      color:white;
      font-size:1.7rem;
      cursor:pointer;
    }

    /* =========================
       HERO
    ========================== */

    .hero{
      min-height:100vh;
      position:relative;
      display:grid;
      grid-template-columns:1.1fr .9fr;
      align-items:center;
      gap:50px;
      padding:130px 8% 80px;
      overflow:hidden;
    }

    .hero::before{
      content:"";
      position:absolute;
      width:650px;
      height:650px;
      right:-250px;
      top:-220px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(214,173,85,.13),transparent 65%);
      pointer-events:none;
    }

    .hero::after{
      content:"";
      position:absolute;
      width:400px;
      height:400px;
      left:-200px;
      bottom:-180px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(214,173,85,.07),transparent 65%);
      pointer-events:none;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:10px;
      color:var(--gold-light);
      text-transform:uppercase;
      font-size:.7rem;
      letter-spacing:3px;
      margin-bottom:25px;
    }

    .eyebrow::before{
      content:"";
      width:35px;
      height:1px;
      background:var(--gold);
    }

    h1{
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(4rem,8vw,8rem);
      line-height:.82;
      font-weight:600;
      letter-spacing:-3px;
      margin-bottom:25px;
    }

    h1 span{
      display:block;
      color:var(--gold-light);
      font-style:italic;
    }

    .hero-subtitle{
      max-width:650px;
      color:#aaa;
      font-size:1rem;
      line-height:1.9;
      margin-bottom:35px;
    }

    .hero-buttons{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:15px 23px;
      text-transform:uppercase;
      letter-spacing:1.5px;
      font-size:.7rem;
      font-weight:700;
      transition:.35s;
      border:1px solid var(--gold);
      cursor:pointer;
    }

    .btn-primary{
      background:var(--gold);
      color:#090909;
    }

    .btn-primary:hover{
      background:var(--gold-light);
      transform:translateY(-3px);
    }

    .btn-outline{
      color:var(--gold-light);
      background:transparent;
    }

    .btn-outline:hover{
      background:var(--gold);
      color:#000;
      transform:translateY(-3px);
    }

    /* AUTHOR PHOTO */

    .hero-photo-wrap{
      position:relative;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .hero-photo-frame{
      width:min(440px,90%);
      position:relative;
      padding:13px;
      border:1px solid var(--line);
    }

    .hero-photo-frame::before{
      content:"";
      position:absolute;
      inset:24px -24px -24px 24px;
      border:1px solid rgba(214,173,85,.15);
      z-index:-1;
    }

    .hero-photo{
      width:100%;
      aspect-ratio:4/5;
      object-fit:cover;
      object-position:center;
      filter:saturate(.88) contrast(1.05);
    }

    .photo-label{
      position:absolute;
      bottom:25px;
      left:-15px;
      background:rgba(7,7,7,.94);
      border:1px solid var(--line);
      padding:15px 20px;
      backdrop-filter:blur(10px);
    }

    .photo-label strong{
      display:block;
      font-family:"Cormorant Garamond",serif;
      font-size:1.3rem;
      color:var(--gold-light);
    }

    .photo-label small{
      color:#999;
      font-size:.6rem;
      text-transform:uppercase;
      letter-spacing:2px;
    }

    /* =========================
       MARQUEE
    ========================== */

    .marquee{
      overflow:hidden;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:17px 0;
      white-space:nowrap;
    }

    .marquee-track{
      display:inline-block;
      animation:marquee 22s linear infinite;
    }

    .marquee span{
      margin:0 28px;
      font-family:"Cormorant Garamond",serif;
      font-size:1.15rem;
      color:#777;
      letter-spacing:3px;
    }

    .marquee b{
      color:var(--gold);
      font-size:.7rem;
    }

    @keyframes marquee{
      from{transform:translateX(0)}
      to{transform:translateX(-50%)}
    }

    /* =========================
       GENERAL
    ========================== */

    section{
      padding:110px 8%;
    }

    .section-tag{
      color:var(--gold);
      font-size:.67rem;
      text-transform:uppercase;
      letter-spacing:3px;
      margin-bottom:15px;
    }

    .section-title{
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(2.8rem,5vw,5rem);
      line-height:.95;
      font-weight:500;
      max-width:850px;
    }

    .section-title em{
      color:var(--gold-light);
    }

    /* =========================
       ABOUT
    ========================== */

    .about{
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:100px;
      align-items:start;
    }

    .about-left{
      position:sticky;
      top:130px;
    }

    .about-number{
      font-family:"Cormorant Garamond",serif;
      font-size:9rem;
      line-height:.7;
      color:rgba(214,173,85,.08);
      font-weight:700;
    }

    .about-right p{
      color:#aaa;
      line-height:1.95;
      margin-top:25px;
      font-size:.96rem;
    }

    .signature{
      font-family:"Cormorant Garamond",serif;
      color:var(--gold-light);
      font-size:2rem;
      font-style:italic;
      margin-top:35px;
    }

    /* =========================
       BOOKS
    ========================== */

    .books-section{
      background:linear-gradient(180deg,#080808,#101010,#080808);
    }

    .books-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:30px;
      margin-bottom:60px;
    }

    .books-note{
      max-width:360px;
      color:#888;
      line-height:1.7;
      font-size:.85rem;
    }

    .books-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:35px;
    }

    .book-card{
      position:relative;
      background:#0b0b0b;
      border:1px solid rgba(255,255,255,.07);
      padding:20px;
      transition:.4s;
      overflow:hidden;
    }

    .book-card:hover{
      transform:translateY(-8px);
      border-color:var(--line);
    }

    .book-image{
      width:100%;
      height:560px;
      object-fit:cover;
      background:#151515;
    }

    .book-info{
      padding:25px 5px 5px;
    }

    .book-number{
      color:var(--gold);
      font-size:.62rem;
      letter-spacing:2px;
    }

    .book-title{
      font-family:"Cormorant Garamond",serif;
      font-size:2.2rem;
      color:var(--cream);
      margin:7px 0;
    }

    .book-description{
      color:#888;
      font-size:.82rem;
      line-height:1.7;
    }

    .book-link{
      display:inline-block;
      margin-top:20px;
      color:var(--gold-light);
      font-size:.65rem;
      text-transform:uppercase;
      letter-spacing:2px;
    }

    /* =========================
       FEATURED IDEA
    ========================== */

    .featured{
      padding-top:130px;
      padding-bottom:130px;
    }

    .featured-box{
      position:relative;
      border:1px solid var(--line);
      padding:70px;
      overflow:hidden;
      background:
        radial-gradient(circle at 85% 20%,rgba(214,173,85,.11),transparent 35%),
        #0c0c0c;
    }

    .featured-box::after{
      content:"“";
      position:absolute;
      right:20px;
      top:-80px;
      font-family:"Cormorant Garamond",serif;
      font-size:25rem;
      color:rgba(214,173,85,.04);
    }

    .featured-box h2{
      position:relative;
      z-index:1;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(3rem,6vw,6.5rem);
      line-height:.9;
      max-width:900px;
    }

    .featured-box h2 span{
      color:var(--gold-light);
      font-style:italic;
    }

    .featured-box p{
      position:relative;
      z-index:1;
      color:#999;
      max-width:620px;
      line-height:1.9;
      margin-top:30px;
    }

    /* =========================
       PHILOSOPHY
    ========================== */

    .philosophy-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1px;
      background:var(--line);
      margin-top:60px;
    }

    .philosophy-card{
      background:#090909;
      padding:45px 35px;
      min-height:270px;
      transition:.35s;
    }

    .philosophy-card:hover{
      background:#111;
    }

    .philosophy-icon{
      color:var(--gold);
      font-size:1.3rem;
      margin-bottom:30px;
    }

    .philosophy-card h3{
      font-family:"Cormorant Garamond",serif;
      font-size:2rem;
      margin-bottom:12px;
    }

    .philosophy-card p{
      color:#888;
      line-height:1.8;
      font-size:.84rem;
    }

    /* =========================
       POETRY
    ========================== */

    .poetry{
      text-align:center;
      padding-top:140px;
      padding-bottom:140px;
      background:#0b0b0b;
      border-top:1px solid rgba(255,255,255,.04);
      border-bottom:1px solid rgba(255,255,255,.04);
    }

    .poetry-mark{
      font-family:"Cormorant Garamond",serif;
      color:var(--gold);
      font-size:5rem;
      line-height:.5;
    }

    .poetry blockquote{
      max-width:1000px;
      margin:35px auto 25px;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(2.2rem,4vw,4.5rem);
      line-height:1;
      color:#eee;
    }

    .poetry cite{
      color:#777;
      font-size:.65rem;
      letter-spacing:3px;
      text-transform:uppercase;
      font-style:normal;
    }

    /* =========================
       CONTACT
    ========================== */

    .contact{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:80px;
      align-items:center;
    }

    .contact-text p{
      color:#888;
      line-height:1.9;
      max-width:540px;
      margin-top:25px;
    }

    .contact-buttons{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .contact-btn{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:25px 28px;
      border:1px solid rgba(255,255,255,.09);
      background:#0d0d0d;
      transition:.35s;
    }

    .contact-btn:hover{
      border-color:var(--gold);
      transform:translateX(7px);
    }

    .contact-btn-left{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .contact-icon{
      width:42px;
      height:42px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid var(--line);
      color:var(--gold-light);
    }

    .contact-btn strong{
      display:block;
      font-size:.85rem;
    }

    .contact-btn small{
      color:#666;
      font-size:.65rem;
    }

    .arrow{
      color:var(--gold);
      font-size:1.2rem;
    }

    /* =========================
       FOOTER
    ========================== */

    footer{
      border-top:1px solid rgba(255,255,255,.07);
      padding:45px 8%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:25px;
    }

    .footer-brand{
      font-family:"Cormorant Garamond",serif;
      font-size:1.7rem;
      color:var(--gold-light);
    }

    .footer-copy{
      color:#555;
      font-size:.65rem;
      letter-spacing:1px;
      text-align:center;
    }

    .official{
      color:#777;
      font-size:.62rem;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    /* =========================
       FLOATING WHATSAPP
    ========================== */

    .floating-wa{
      position:fixed;
      right:22px;
      bottom:22px;
      width:58px;
      height:58px;
      border-radius:50%;
      background:#111;
      border:1px solid var(--gold);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:900;
      box-shadow:0 10px 35px rgba(0,0,0,.45);
      transition:.3s;
    }

    .floating-wa:hover{
      transform:translateY(-5px) scale(1.04);
      background:var(--gold);
    }

    .floating-wa svg{
      width:27px;
      height:27px;
      fill:var(--gold-light);
    }

    .floating-wa:hover svg{
      fill:#000;
    }

    /* =========================
       REVEAL
    ========================== */

    .reveal{
      opacity:0;
      transform:translateY(35px);
      transition:opacity .9s ease,transform .9s ease;
    }

    .reveal.show{
      opacity:1;
      transform:none;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:900px){

      nav{
        padding:18px 5%;
      }

      .nav-links{
        position:absolute;
        top:72px;
        left:0;
        right:0;
