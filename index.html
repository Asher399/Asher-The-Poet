<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asher The Poet | Official Website</title>

<meta name="description" content="The official website of Asher The Poet — Jacob Stephen Mphampha. Poet, author, storyteller, traveller and servant of God.">
<meta name="author" content="Jacob Stephen Mphampha">
<meta name="theme-color" content="#080808">

<meta property="og:title" content="Asher The Poet | Official Website">
<meta property="og:description" content="Poet • Author • Storyteller • Traveller • Servant of God">
<meta property="og:type" content="website">

<!-- INSTALLABLE APP CONFIGURATION -->
<link rel="manifest" href="/Asher-The-Poet/manifest.json">
<link rel="icon" href="/Asher-The-Poet/icons/asher-icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/Asher-The-Poet/icons/asher-icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --gold: #d4af37;
    --gold-light: #f4d675;
    --gold-dark: #8e7420;
    --black: #050505;
    --black2: #0b0b0b;
    --black3: #111111;
    --white: #f7f5ef;
    --muted: #a6a6a6;
    --line: rgba(212,175,55,.22);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at 80% 10%,rgba(212,175,55,.08),transparent 30%),
        radial-gradient(circle at 10% 70%,rgba(212,175,55,.05),transparent 30%),
        var(--black);
    color: var(--white);
    font-family: "DM Sans",sans-serif;
    overflow-x: hidden;
}

body:before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
    z-index: 9999;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    max-width: 100%;
    display: block;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.container {
    width: min(1180px,92%);
    margin: auto;
}

.gold {
    color: var(--gold);
}

/* LOADER */

.loader {
    position: fixed;
    inset: 0;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    animation: loaderOut 1s ease 1.5s forwards;
    pointer-events: none;
}

.loader-content {
    text-align: center;
}

.loader-logo {
    font-family: "Cormorant Garamond",serif;
    font-size: 42px;
    letter-spacing: 8px;
    color: var(--gold);
    animation: pulse 1.2s infinite alternate;
}

.loader-line {
    width: 130px;
    height: 1px;
    background: var(--gold);
    margin: 18px auto;
}

.loader-small {
    color: #888;
    font-size: 11px;
    letter-spacing: 4px;
}

@keyframes pulse {
    from { opacity: .45; transform: scale(.98); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes loaderOut {
    to { opacity: 0; visibility: hidden; }
}

/* NAVIGATION */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 5000;
    background: rgba(5,5,5,.88);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.nav-inner {
    min-height: 78px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
    flex-shrink: 0;
}

.logo-mark {
    width: 38px;
    height: 38px;
    border: 1px solid var(--gold);
    display: grid;
    place-items: center;
    color: var(--gold);
    font-family: "Cormorant Garamond",serif;
    font-size: 20px;
    transform: rotate(45deg);
}

.logo-mark span {
    transform: rotate(-45deg);
}

.logo-text strong {
    display: block;
    font-size: 13px;
    letter-spacing: 3px;
}

.logo-text small {
    color: var(--gold);
    letter-spacing: 2px;
    font-size: 8px;
}

.nav-links {
    display: flex;
    gap: 22px;
    align-items: center;
}

.nav-links a {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #bbb;
    transition: .3s;
}

.nav-links a:hover {
    color: var(--gold);
}

.nav-contact {
    border: 1px solid var(--gold);
    padding: 11px 17px;
    color: var(--gold) !important;
}

.menu {
    display: none;
    font-size: 28px;
    color: var(--gold);
    cursor: pointer;
    background: transparent;
    border: 0;
}

/* BUTTONS */

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    padding: 14px 23px;
    border: 1px solid var(--gold);
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 2px;
    transition: .35s;
    background: transparent;
}

.btn-primary {
    background: var(--gold);
    color: #080808;
}

.btn-outline {
    color: var(--gold);
}

.btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 35px rgba(212,175,55,.18);
}

/* HERO */

.hero {
    min-height: 100vh;
    padding: 150px 0 90px;
    display: flex;
    align-items: center;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 70px;
    align-items: center;
}

.hero-label {
    color: var(--gold);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 5px;
    margin-bottom: 22px;
}

.hero h1 {
    font-family: "Cormorant Garamond",serif;
    font-weight: 600;
    font-size: clamp(58px,8vw,110px);
    line-height: .82;
    letter-spacing: -3px;
}

.hero h1 span {
    color: var(--gold);
    display: block;
}

.hero-sub {
    margin-top: 28px;
    color: #b7b7b7;
    font-size: 15px;
    line-height: 1.9;
    max-width: 560px;
}

.hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 13px;
    margin-top: 34px;
}

.hero-image-wrap {
    position: relative;
    max-width: 450px;
    margin: auto;
}

.hero-image-wrap:before {
    content: "";
    position: absolute;
    inset: -18px;
    border: 1px solid rgba(212,175,55,.25);
    transform: rotate(3deg);
}

.hero-image-wrap:after {
    content: "";
    position: absolute;
    inset: 18px -18px -18px 18px;
    border: 1px solid rgba(212,175,55,.12);
    z-index: -1;
}

.hero-image {
    width: 100%;
    aspect-ratio: 4/5;
    object-fit: cover;
    object-position: center;
    filter: grayscale(10%);
    position: relative;
    z-index: 2;
}

.hero-badge {
    position: absolute;
    bottom: 22px;
    left: -28px;
    z-index: 3;
    background: #090909;
    border: 1px solid var(--line);
    padding: 17px 20px;
    box-shadow: 0 20px 50px #000;
}

.hero-badge strong {
    display: block;
    color: var(--gold);
    font-family: "Cormorant Garamond",serif;
    font-size: 23px;
    white-space: nowrap;
}

.hero-badge small {
    color: #888;
    font-size: 9px;
    letter-spacing: 2px;
}

/* MARQUEE */

.marquee {
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 17px 0;
    overflow: hidden;
    white-space: nowrap;
}

.marquee-track {
    display: inline-block;
    animation: marquee 25s linear infinite;
}

.marquee span {
    margin: 0 35px;
    font-family: "Cormorant Garamond",serif;
    font-size: 20px;
    color: #888;
}

.marquee b {
    color: var(--gold);
}

@keyframes marquee {
    to { transform: translateX(-50%); }
}

/* GENERAL SECTIONS */

section {
    padding: 110px 0;
    scroll-margin-top: 75px;
}

.section-top {
    display: flex;
    justify-content: space-between;
    gap: 30px;
    align-items: end;
    margin-bottom: 55px;
}

.eyebrow {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 13px;
}

.section-title {
    font-family: "Cormorant Garamond",serif;
    font-size: clamp(42px,6vw,70px);
    font-weight: 500;
    line-height: .95;
}

.section-description {
    max-width: 420px;
    color: #8e8e8e;
    line-height: 1.8;
    font-size: 13px;
}

/* ABOUT */

.about-grid {
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 80px;
}

.about-number {
    font-family: "Cormorant Garamond",serif;
    font-size: 150px;
    color: rgba(212,175,55,.08);
    line-height: .7;
}

.about-copy {
    color: #aaa;
    line-height: 1.95;
    font-size: 15px;
}

.about-copy p {
    margin-bottom: 22px;
}

.signature {
    font-family: "Cormorant Garamond",serif;
    color: var(--gold);
    font-size: 29px;
    font-style: italic;
    margin-top: 30px;
}

/* BOOKS */

.books {
    background: linear-gradient(rgba(255,255,255,.018),rgba(255,255,255,.018));
}

.books-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 30px;
}

.book-card {
    background: linear-gradient(145deg,#101010,#080808);
    border: 1px solid rgba(255,255,255,.08);
    padding: 25px;
    transition: .4s;
}

.book-card:hover {
    border-color: rgba(212,175,55,.5);
    transform: translateY(-8px);
}

.book-cover {
    height: 500px;
    overflow: hidden;
    background: #161616;
    position: relative;
}

.book-cover img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    transition: .6s;
}

.book-card:hover .book-cover img {
    transform: scale(1.025);
}

.book-info {
    padding: 25px 5px 5px;
}

.book-number {
    color: var(--gold);
    font-size: 9px;
    letter-spacing: 3px;
}

.book-title {
    font-family: "Cormorant Garamond",serif;
    font-size: 34px;
    margin: 8px 0 4px;
}

.book-price {
    display: inline-block;
    color: #080808;
    background: var(--gold);
    padding: 7px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    margin: 8px 0 15px;
}

.book-info p {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
}

.buy-book {
    width: 100%;
    margin-top: 22px;
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
}

.buy-book:hover {
    background: var(--gold);
    color: #080808;
}

/* TRAVEL JOURNAL */

.travel-section {
    position: relative;
    background:
        radial-gradient(circle at 15% 20%,rgba(212,175,55,.07),transparent 35%),
        radial-gradient(circle at 85% 80%,rgba(212,175,55,.05),transparent 35%),
        #070707;
    overflow: hidden;
}

.travel-heading {
    max-width: 680px;
    margin-bottom: 45px;
}

.travel-heading p {
    color: #858585;
    font-size: 14px;
    line-height: 1.9;
    margin-top: 22px;
}

.travel-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 30px;
}

.travel-card {
    position: relative;
    background: #090909;
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
    transition: .5s ease;
}

.travel-card:hover {
    transform: translateY(-10px);
    border-color: rgba(212,175,55,.55);
    box-shadow: 0 25px 70px rgba(0,0,0,.55);
}

.travel-video-wrap {
    position: relative;
    background: #000;
    aspect-ratio: 16/10;
    overflow: hidden;
}

.travel-video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #000;
}

.travel-number {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 3;
    padding: 8px 12px;
    background: rgba(5,5,5,.82);
    border: 1px solid rgba(212,175,55,.45);
    color: var(--gold);
    font-size: 9px;
    letter-spacing: 3px;
    pointer-events: none;
}

.travel-info {
    padding: 25px 25px 28px;
}

.travel-location {
    color: var(--gold);
    text-transform: uppercase;
    font-size: 9px;
    letter-spacing: 3px;
    margin-bottom: 10px;
}

.travel-title {
    font-family: "Cormorant Garamond",serif;
    font-size: 34px;
    font-weight: 500;
    margin-bottom: 10px;
}

.travel-description {
    color: #808080;
    font-size: 13px;
    line-height: 1.75;
}

.travel-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
    padding-top: 17px;
    border-top: 1px solid rgba(255,255,255,.07);
}

.travel-meta span,
.travel-meta strong {
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.travel-meta span {
    color: #666;
}

.travel-meta strong {
    color: var(--gold);
}

.travel-note {
    text-align: center;
    margin-top: 50px;
    color: #666;
    font-family: "Cormorant Garamond",serif;
    font-size: 22px;
    font-style: italic;
}

/* FEATURED PROJECT */

.featured-box {
    border: 1px solid var(--line);
    min-height: 470px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
    background:
        radial-gradient(circle at 70% 50%,rgba(212,175,55,.1),transparent 40%),
        #090909;
}

.featured-content {
    padding: 70px;
    display: flex;
    justify-content: center;
    flex-direction: column;
}

.featured-content h3 {
    font-family: "Cormorant Garamond",serif;
    font-size: clamp(42px,5vw,70px);
    line-height: .9;
    font-weight: 500;
}

.featured-content h3 span {
    color: var(--gold);
}

.featured-content p {
    color: #929292;
    line-height: 1.8;
    margin: 25px 0;
    max-width: 500px;
}

.featured-art {
    display: grid;
    place-items: center;
    position: relative;
    min-height: 350px;
}

.featured-art:before {
    content: "MIND";
    font-family: "Cormorant Garamond",serif;
    font-size: clamp(70px,12vw,150px);
    color: rgba(212,175,55,.06);
    transform: rotate(-90deg);
}

/* PHILOSOPHY */

.philosophy-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
}

.philosophy-card {
    padding: 38px 30px;
    border: 1px solid rgba(255,255,255,.08);
    min-height: 220px;
    transition: .35s;
}

.philosophy-card:hover {
    border-color: var(--gold);
    transform: translateY(-7px);
}

.philosophy-icon {
    color: var(--gold);
    font-family: "Cormorant Garamond",serif;
    font-size: 45px;
}

.philosophy-card h3 {
    font-family: "Cormorant Garamond",serif;
    font-size: 30px;
    margin: 10px 0;
}

.philosophy-card p {
    color: #858585;
    font-size: 13px;
    line-height: 1.7;
}

/* QUOTE */

.quote-section {
    text-align: center;
    padding: 130px 0;
    background: radial-gradient(circle,rgba(212,175,55,.09),transparent 45%);
}

.quote-mark {
    color: var(--gold);
    font-family: "Cormorant Garamond",serif;
    font-size: 80px;
    line-height: .5;
}

.quote {
    max-width: 900px;
    margin: 25px auto;
    font-family: "Cormorant Garamond",serif;
    font-size: clamp(32px,5vw,62px);
    line-height: 1.05;
}

.quote-author {
    color: #777;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 9px;
}

/* CONTACT */

.contact-box {
    border: 1px solid var(--line);
    padding: 70px;
    text-align: center;
    background:
        radial-gradient(circle at center,rgba(212,175,55,.08),transparent 45%),
        #090909;
}

.contact-box h2 {
    font-family: "Cormorant Garamond",serif;
    font-size: clamp(45px,6vw,75px);
    font-weight: 500;
}

.contact-box p {
    color: #888;
    max-width: 560px;
    margin: 20px auto 30px;
    line-height: 1.8;
    font-size: 13px;
}

.contact-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 13px;
}

.contact-btn {
    min-width: 190px;
}

/* FOOTER */

footer {
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 40px 0;
}

.footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    align-items: center;
}

.footer-name {
    font-family: "Cormorant Garamond",serif;
    font-size: 28px;
    color: var(--gold);
}

.footer-copy {
    color: #666;
    font-size: 10px;
    letter-spacing: 1px;
}

/* FLOATING WHATSAPP */

.whatsapp-float {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #25D366;
    display: grid;
    place-items: center;
    z-index: 4000;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    transition: .3s;
}

.whatsapp-float:hover {
    transform: scale(1.1);
}

.whatsapp-float svg {
    width: 27px;
    height: 27px;
    fill: white;
}

/* INSTALL APP BUTTON */

.install-app {
    position: fixed;
    left: 18px;
    bottom: 20px;
    z-index: 4500;
    display: none;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: #080808;
    border: 1px solid var(--gold-light);
    padding: 13px 17px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    box-shadow: 0 8px 25px rgba(0,0,0,.4);
}

.install-app:hover {
    background: var(--gold-light);
    transform: translateY(-3px);
}

/* REVEAL ANIMATION */

.reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: 1s ease;
}

.reveal.active {
    opacity: 1;
    transform: none;
}

/* MOBILE */

@media(max-width:850px) {
    .nav-links {
        position: absolute;
        top: 78px;
        left: 0;
        width: 100%;
        padding: 25px;
        background: rgba(5,5,5,.98);
        display: none;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        border-bottom: 1px solid var(--line);
    }

    .nav-links.show {
        display: flex;
    }

    .nav-links a {
        padding: 16px 5px;
        border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .nav-contact {
        text-align: center;
        margin-top: 10px;
    }

    .menu {
        display: block;
    }

    .hero {
        padding-top: 130px;
    }

    .hero-grid {
        grid-template-columns: 1fr;
        gap: 65px;
    }

    .hero h1 {
        font-size: 70px;
    }

    .hero-image-wrap {
        max-width: 390px;
    }

    .about-grid {
        grid-template-columns: 1fr;
        gap: 35px;
    }

    .about-number {
        font-size: 100px;
    }

    .section-top {
        display: block;
    }

    .section-description {
        margin-top: 20px;
    }

    .books-grid,
    .travel-grid {
