<meta property="og:description" content="Official website of Asher The Poet — Jacob Stephen Mphampha.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =====================================================
   ROOT
===================================================== */

:root{
    --bg:#070707;
    --bg2:#0d0d0d;
    --card:#111111;
    --gold:#d4ad58;
    --gold2:#f0d58d;
    --white:#f7f3eb;
    --muted:#96928a;
    --line:rgba(212,173,88,.18);
    --soft-line:rgba(255,255,255,.07);
}

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--white);
    font-family:"DM Sans",sans-serif;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:9998;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
}

::selection{
    background:var(--gold);
    color:#000;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    max-width:100%;
    display:block;
}

button{
    font:inherit;
}

/* =====================================================
   LOADER
===================================================== */

.loader{
    position:fixed;
    inset:0;
    z-index:10000;
    background:#050505;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:opacity .8s ease, visibility .8s ease;
}

.loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader-content{
    text-align:center;
}

.loader-title{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(2.4rem,7vw,4.5rem);
    letter-spacing:5px;
    color:var(--gold2);
}

.loader-line{
    width:90px;
    height:1px;
    margin:18px auto;
    background:var(--gold);
    animation:loaderLine 1.5s infinite;
}

.loader-sub{
    color:#777;
    font-size:.62rem;
    letter-spacing:4px;
    text-transform:uppercase;
}

@keyframes loaderLine{
    0%,100%{transform:scaleX(.3);opacity:.3}
    50%{transform:scaleX(1);opacity:1}
}

/* =====================================================
   NAVIGATION
===================================================== */

.navbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:5000;
    padding:20px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(7,7,7,.72);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(255,255,255,.04);
}

.brand{
    display:flex;
    flex-direction:column;
}

.brand-main{
    font-family:"Cormorant Garamond",serif;
    color:var(--gold2);
    font-size:1.65rem;
    font-weight:700;
    letter-spacing:2px;
}

.brand-small{
    color:#777;
    font-size:.52rem;
    letter-spacing:3px;
    text-transform:uppercase;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    color:#aaa;
    font-size:.67rem;
    letter-spacing:1.8px;
    text-transform:uppercase;
    transition:.3s ease;
}

.nav-links a:hover{
    color:var(--gold2);
}

.nav-cta{
    border:1px solid var(--line);
    padding:11px 17px;
    color:var(--gold2)!important;
}

.menu-btn{
    display:none;
    border:0;
    background:none;
    color:var(--white);
    font-size:1.7rem;
    cursor:pointer;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    min-height:100vh;
    padding:145px 8% 90px;
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:70px;
    position:relative;
    overflow:hidden;
}

.hero-glow{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    right:-300px;
    top:-300px;
    background:radial-gradient(circle,rgba(212,173,88,.14),transparent 68%);
    pointer-events:none;
}

.hero-glow2{
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    left:-300px;
    bottom:-250px;
    background:radial-gradient(circle,rgba(212,173,88,.07),transparent 68%);
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:2;
}

.overline{
    display:flex;
    align-items:center;
    gap:12px;
    color:var(--gold2);
    font-size:.65rem;
    text-transform:uppercase;
    letter-spacing:3px;
    margin-bottom:25px;
}

.overline::before{
    content:"";
    width:40px;
    height:1px;
    background:var(--gold);
}

.hero h1{
    font-family:"Cormorant Garamond",serif;
    font-size:clamp(4.5rem,9vw,9rem);
    line-height:.78;
    letter-spacing:-4px;
    font-weight:600;
}

.hero h1 span{
    display:block;
    color:var(--gold2);
    font-style:italic;
}

.hero-description{
    max-width:650px;
    color:#999;
    line-height:1.9;
    margin:35px 0;
    font-size:.95rem;
}

.hero-buttons{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
}

.btn{
    min-height:52px;
    padding:0 24px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    border:1px solid var(--gold);
    font-size:.65rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1.6px;
    transition:.35s;
}

.btn-primary{
    background:var(--gold);
    color:#050505;
}

.btn-primary:hover{
    background:var(--gold2);
    transform:translateY(-4px);
    box-shadow:0 15px 40px rgba(212,173,88,.14);
}

.btn-outline{
    color:var(--gold2);
}

.btn-outline:hover{
    background:var(--gold);
    color:#000;
    transform:translateY(-4px);
}

/* HERO PHOTO */

.hero-visual{
    position:relative;
    display:flex;
    justify-content:center;
}

.photo-outer{
    position:relative;
    width:min(450px,90%);
}

.photo-outer::before{
    content:"";
    position:absolute;
    inset:25px -25px -25px 25px;
    border:1px solid var(--line);
}

.photo-outer::after{
    content:"";
    position:absolute;
    width:90px;
    height:90px;
    top:-18px;
    right:-18px;
    border-top:1px solid var(--gold);
    border-right:1px solid var(--gold);
}

.author-photo{
    width:100%;
    aspect-ratio:4/5;
    object-fit:cover;
    position:relative;
    z-index:2;
    filter:contrast(1.05) saturate(.85);
    border:10px solid #0b0b0b;
    outline:1px solid var(--line);
}

.photo-caption{
    position:absolute;
    z-index:3;
    bottom:25px;
    left:-20px;
    padding:17px 22px;
    background:rgba(8,8,8,.92);
    backdrop-filter:blur(15px);
    border:1px solid var(--line);
}

.photo-caption strong{
    display:block;
    color:var(--gold2);
    font-family:"Cormorant Garamond",serif;
    font-size:1.35rem;
}

.photo-caption span{
    color:#777;
    font-size:.58rem;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =====================================================
   MARQUEE
===================================================== */

.marquee{
    overflow:hidden;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    padding:17px 0;
    white-space:nowrap;
}

.marquee-track{
    display:inline-block;
    animation:move 25s linear infinite;
}

.marquee span{
    margin:0 30px;
    color:#666;
    font-family:"Cormorant Garamond",serif;
    font-size:1.2rem;
    letter-spacing:3px;
}

.marquee b{
